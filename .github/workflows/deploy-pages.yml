name: Deploy public site to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck public site
        run: pnpm --filter @workspace/stonegate-site typecheck

      - name: Build public site
        run: pnpm --filter @workspace/stonegate-site build
        env:
          VITE_BASE_PATH: /

      - name: Configure Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Add SPA fallback
        if: github.event_name != 'pull_request'
        run: |
          cp artifacts/stonegate-site/dist/public/index.html artifacts/stonegate-site/dist/public/404.html
          touch artifacts/stonegate-site/dist/public/.nojekyll
          cp CNAME artifacts/stonegate-site/dist/public/CNAME

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/stonegate-site/dist/public

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
