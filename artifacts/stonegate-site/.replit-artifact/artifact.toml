kind = "web"
previewPath = "/"
title = "Stonegate Intelligence Group"
version = "1.0.0"
id = "artifacts/stonegate-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19762

[services.development]
run = "pnpm --filter @workspace/stonegate-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stonegate-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/stonegate-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19762"
BASE_PATH = "/"
